<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; object-src 'none'; frame-ancestors 'none';"/>
<title>Helix Core</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0f1117;
    color: #e2e8f0;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
  }

  .logo {
    width: 88px;
    height: 88px;
    border-radius: 20px;
    background: linear-gradient(135deg, #3385ff 0%, #7c3aed 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    margin-bottom: 24px;
    box-shadow: 0 0 40px rgba(51, 133, 255, 0.3);
    animation: logoPulse 2s ease-in-out infinite;
  }

  @keyframes logoPulse {
    0%, 100% { box-shadow: 0 0 40px rgba(51, 133, 255, 0.3); transform: scale(1); }
    50% { box-shadow: 0 0 60px rgba(51, 133, 255, 0.5); transform: scale(1.03); }
  }

  .title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    background: linear-gradient(90deg, #e2e8f0, #3385ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 12px;
    color: #64748b;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 36px;
  }

  .loader {
    width: 180px;
    height: 3px;
    background: #1a1f2e;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .loader-bar {
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, #3385ff, #7c3aed);
    border-radius: 3px;
    animation: slide 1.4s ease-in-out infinite;
  }

  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  .status {
    font-size: 11px;
    color: #475569;
    letter-spacing: 0.5px;
  }

  .version {
    position: absolute;
    bottom: 14px;
    right: 18px;
    font-size: 10px;
    color: #334155;
  }
</style>
</head>
